# PocketPet 配置文件示例。复制为 configs/pocketpet.yaml 或仓库根的 pocketpet.yaml 后按需修改，
# 也可以用 -config 指定任意路径。
# 优先级：启动参数 > 环境变量 > 本文件 > 默认值。
# 真实的 pocketpet.yaml（根目录及 configs/ 下）已在 .gitignore 中（不要提交含密钥引用的个人配置）。

server:
  listen: ":8080"

data_dir: ./data          # 数据根目录：SQLite 与宠物文件（pets/<id>/）
skills_dir: ./skills      # 全局技能目录

tick:
  interval_seconds: 60        # tick 结算间隔
  offline_catchup_max_hours: 24  # 离线补算时长上限

# 状态驱动的主动行为（饿了/脏了/困了/病了/心情低落/睡醒时）。
proactive:
  enabled: true      # 总开关
  auto_sleep: true   # 精力进入低位时自动入睡
  auto_wake: true    # 睡眠中精力恢复满后自动醒来
  messages: true     # 状态变化时由 LLM 生成第一人称主动消息（pet.proactive 事件，SSE 推送）；
                     # 未配置 llm 时自动跳过消息，仅推送固定文案的告警事件

log:
  level: info   # 日志级别：debug / info / warn / error；也可用 POCKETPET_LOG_LEVEL 覆盖。
                # 终端运行时日志自动彩色显示；重定向到文件/管道时自动关闭颜色（NO_COLOR 可强制关闭）。

llm:
  # 任意 OpenAI Chat Completions 兼容端点（OpenAI 官方 / DeepSeek / Moonshot / vLLM / Ollama 等）。
  # model 与 api_key 必填；base_url 留空 = OpenAI 官方地址。密钥直接写在这里。
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: sk-xxx

# 宠物级覆盖：AGENT.md 的 model 字段可让单只宠物换用别的模型（其余连接参数继承全局）。

# MetaAgent 诞生（见 docs/04-MetaAgent宠物诞生设计.md）。
genesis:
  timeout_seconds: 90       # 单次诞生上限；超时走 seed fallback。也可用 POCKETPET_GENESIS_TIMEOUT。
  script_pace_ms: 80        # 无 LLM 时脚本各阶段间隔（SSE 观感）；0=尽快。POCKETPET_GENESIS_SCRIPT_PACE。
  legacy_create: instant    # 旧 POST /v1/pets：instant=即时模板；birth=转发 MetaAgent（同步 await）。
                            # 也可用 POCKETPET_GENESIS_LEGACY_CREATE。

mcp:
  servers: []        # POCKETPET_MCP_SERVERS(JSON) 非空时整体覆盖本列表
  # - name: weather
  #   command: /usr/local/bin/mcp-weather
  #   args: ["--units", "metric"]
  #   env: {}

# 内置 Go 玩法插件（编译期注册）。段缺失时全部默认启用、使用代码内默认数值。
# 各玩法插件彼此独立，可单独开关；关闭后需重启。
plugins:
  adventure:
    enabled: true
    # map_refresh_interval_seconds: 21600  # 自动换图墙钟秒数，默认 6 小时；<=0 关闭
    # node_count: 12
    # max_branches: 5
    # chest_min_pct: 0.15
    # chest_max_pct: 0.25
    # energy_cost: 15
    # step_interval_seconds: 5  # 行程步进（墙钟秒）；与养成 tick 无关
  friends:
    enabled: true
    # visit_affinity: 5
    # visit_happy: 8
    # peek_affinity: 2
    # gift_affinity: 3
    # gift_happy: 5

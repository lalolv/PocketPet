# PocketPet 配置文件示例。复制为 configs/pocketpet.yaml 或仓库根的 pocketpet.yaml 后按需修改，
# 也可以用 -config 指定任意路径。
# 优先级：启动参数 > 环境变量 > 本文件 > 默认值。
# 真实的 pocketpet.yaml（根目录及 configs/ 下）已在 .gitignore 中（不要提交含密钥引用的个人配置）。

server:
  listen: ":8080"

data_dir: ./data          # 数据根目录：SQLite 与宠物文件（pets/<id>/）
skills_dir: ./skills      # 全局技能目录

tick:
  interval_seconds: 60        # tick 结算间隔
  offline_catchup_max_hours: 24  # 离线补算时长上限

log:
  level: info   # 日志级别：debug / info / warn / error；也可用 POCKETPET_LOG_LEVEL 覆盖。
                # 终端运行时日志自动彩色显示；重定向到文件/管道时自动关闭颜色（NO_COLOR 可强制关闭）。

llm:
  # 任意 OpenAI Chat Completions 兼容端点（OpenAI 官方 / DeepSeek / Moonshot / vLLM / Ollama 等）。
  # model 与 api_key 必填；base_url 留空 = OpenAI 官方地址。密钥直接写在这里。
  model: deepseek-chat
  base_url: https://api.deepseek.com
  api_key: sk-xxx

# 宠物级覆盖：AGENT.md 的 model 字段可让单只宠物换用别的模型（其余连接参数继承全局）。

mcp:
  servers: []        # POCKETPET_MCP_SERVERS(JSON) 非空时整体覆盖本列表
  # - name: weather
  #   command: /usr/local/bin/mcp-weather
  #   args: ["--units", "metric"]
  #   env: {}
